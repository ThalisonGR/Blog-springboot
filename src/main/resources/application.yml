spring:
  application:
    name: blog

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/blog?useSSL=false
    username: root
    password:
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: update

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  doc:
    swagger-ui:
      operationsSorter: method
    api-docs:
      path: /api-docs-artigo

management:
  endpoints:
    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  endpoint:
    health:
      show-details: always

server:
  error:
    whitelabel:
      enabled: false

info:
  app:
    name: Blog
    description: API de blog para ser utilizada open-source demo
    version: 1.0.0